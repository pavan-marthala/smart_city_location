databaseChangeLog:
  - changeSet:
      id: city-table-001
      author: pavan
      changes:
        - createTable:
            tableName: city
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: etag
                  type: BIGINT
                  defaultValue: 0
                  constraints:
                    nullable: false
